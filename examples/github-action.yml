# Example CI step — copy into .github/workflows when you want a one-shot agent.
# Requires repo secrets: CURSOR_API_KEY, and any tool tokens you want attached.
name: mind-cursor
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for the Cursor agent
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsx src/cli.ts run "${{ inputs.prompt }}" --profile ci --no-stream
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
